services:
  postgres:
    image: postgres:16-alpine
    container_name: freelance-postgres-website
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: Freelance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-freelance-website
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: vladislav.mnac@gmail.com
      PGADMIN_DEFAULT_PASSWORD: 1
    ports:
      - "5050:80"
    networks:
      - app-network
    depends_on:
      - postgres

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
